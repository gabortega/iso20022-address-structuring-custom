name: Build and Deploy to Azure Container App

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.13'
  APP_NAME: 'iso-address-structuring-grpc'
  IMAGE_NAME: 'iso20022-address-structuring-grpc'
  ARTIFACT_NAME: 'iso-address-structuring-grpc-${{ github.run_id }}'
  BASE_IMAGE_NAME: 'base-image-${{ github.run_id }}'

jobs:
  build-python:
    name: Build Python dependencies
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Download dependencies
        run: |
          wget -nv -P resources/raw/geonames https://download.geonames.org/export/dump/allCountries.zip
          wget -nv -P resources/raw/geonames https://download.geonames.org/export/dump/countryInfo.txt
          wget -nv -P resources/raw/geonames https://download.geonames.org/export/dump/alternateNamesV2.zip
          
          wget -nv -P resources/raw/postcodes https://download.geonames.org/export/zip/allCountries.zip
          wget -nv -P resources/raw/postcodes https://download.geonames.org/export/zip/CA_full.csv.zip
          wget -nv -P resources/raw/postcodes https://download.geonames.org/export/zip/GB_full.csv.zip
          wget -nv -P resources/raw/postcodes https://download.geonames.org/export/zip/NL_full.csv.zip
          
          wget -nv -P resources/raw/restCountries \
          https://gitlab.com/restcountries/restcountries/-/raw/master/src/main/resources/countriesV3.1.json

      - name: Explode dependencies
        run: |
          unzip resources/raw/geonames/allCountries.zip -d resources/raw/geonames
          unzip resources/raw/geonames/alternateNamesV2.zip -d resources/raw/geonames
          
          unzip resources/raw/postcodes/allCountries.zip -d resources/raw/postcodes
          unzip resources/raw/postcodes/CA_full.csv.zip -d resources/raw/postcodes
          unzip resources/raw/postcodes/GB_full.csv.zip -d resources/raw/postcodes
          unzip resources/raw/postcodes/NL_full.csv.zip -d resources/raw/postcodes

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Create and activate virtual environment
        run: |
          python -m venv venv
          source venv/bin/activate

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run flake8
        run: python -m flake8 data_structuring grpc_api tests

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run preprocessing scripts
        run: |
          export PYTHONPATH=$(pwd)
          python data_structuring/preprocessing/preprocess_geonames_countries.py
          python data_structuring/preprocessing/preprocess_geonames_towns.py
          python data_structuring/preprocessing/preprocess_geonames_postcodes.py
          python data_structuring/preprocessing/preprocess_rest_countries.py

      - name: Remove raw dependencies
        run: rm -rf resources/raw

      - name: Zip artifact for testing and deployment
        run: zip -r release.zip . --exclude "*.git*" --exclude "venv/*" --exclude "__pycache__/*"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: release.zip

  build-base-image:
    name: Build base Docker image
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build base image and export
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.base
          tags: ${{ env.BASE_IMAGE_NAME }}:latest
          outputs: type=docker,dest=${{ runner.temp }}/${{ env.BASE_IMAGE_NAME }}.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BASE_IMAGE_NAME }}
          path: ${{ runner.temp }}/${{ env.BASE_IMAGE_NAME }}.tar

  unit-test:
    name: Run unit tests
    runs-on: ubuntu-latest
    needs: build-python
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.event_name == 'pull_request'

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}

      - name: Unzip artifact
        run: unzip release.zip

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install testing dependencies
        run: pip install -r requirements-test.txt

      - name: Run unit tests
        run: pytest -n auto tests/unit

  integration-test:
    name: Run integration tests
    runs-on: ubuntu-latest
    needs: build-python
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.event_name == 'pull_request'

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}

      - name: Unzip artifact
        run: unzip release.zip

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install testing dependencies
        run: pip install -r requirements-test.txt

      - name: Run integration tests
        run: pytest tests/integration

  push-image:
    name: Push to Azure Container Registry
    runs-on: ubuntu-latest
    needs: [ build-base-image, unit-test, integration-test ]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment:
      name: azure-containers

    steps:
      - name: Download Python code artifact
        uses: actions/download-artifact@v6
        with:
          name: ${{ env.ARTIFACT_NAME }}

      - name: Unzip Python code artifact
        run: unzip release.zip

      - name: Download base image artifact
        uses: actions/download-artifact@v6
        with:
          name: ${{ env.BASE_IMAGE_NAME }}
          path: ${{ runner.temp }}

      - name: Load base image
        run: docker load --input ${{ runner.temp }}/${{ env.BASE_IMAGE_NAME }}.tar

      - name: Login to Azure Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.REGISTRY_NAME }}.azurecr.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.final
          build-args: BASE_IMAGE=${{ env.BASE_IMAGE_NAME }}:latest
          push: true
          tags: ${{ secrets.REGISTRY_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest

  deploy-container:
    name: Deploy Azure Container App
    runs-on: ubuntu-latest
    needs: push-image
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment:
      name: azure-containers

    steps:
      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          acrName: ${{ secrets.REGISTRY_NAME }}
          acrUsername: ${{ secrets.REGISTRY_USERNAME }}
          acrPassword: ${{ secrets.REGISTRY_PASSWORD }}
          containerAppName: ${{ env.APP_NAME }}
          resourceGroup: ${{ secrets.RESOURCE_GROUP }}
          imageToDeploy: ${{ secrets.REGISTRY_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest

      - name: Logout of Azure
        run: az logout