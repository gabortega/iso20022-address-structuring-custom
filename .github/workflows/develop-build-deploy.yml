name: CI/CD to ACR/ACA (develop)

on:
  push:
    branches: [ develop ]

concurrency:
  group: develop-build-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.13'
  ARTIFACT_NAME: 'iso-address-structuring-grpc-${{ github.run_id }}'
  BASE_IMAGE_NAME: 'base-image-${{ github.run_id }}'
  FINAL_IMAGE_NAME: 'iso20022-address-structuring-grpc'

jobs:
  build-python:
    name: Build Python Application
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: ./.github/actions/build-app
        with:
          artifact-name: ${{ env.ARTIFACT_NAME }}

  build-base-image:
    name: Build base Docker image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/build-base-image
        with:
          base-image-name: ${{ env.BASE_IMAGE_NAME }}
          base-image-tag: ${{ github.sha }}

  unit-test:
    name: Run unit tests
    runs-on: ubuntu-latest
    needs: build-python

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/run-unit-tests
        with:
          artifact-name: ${{ env.ARTIFACT_NAME }}

  integration-test:
    name: Run integration tests
    runs-on: ubuntu-latest
    needs: build-python

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/run-integration-tests
        with:
          artifact-name: ${{ env.ARTIFACT_NAME }}

  push-image:
    name: Push to Azure Container Registry
    runs-on: ubuntu-latest
    needs: [ build-base-image, unit-test, integration-test ]
    environment:
      name: azure-containers

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/push-docker-image
        with:
          artifact-name: ${{ env.ARTIFACT_NAME }}
          base-image-name: ${{ env.BASE_IMAGE_NAME }}
          base-image-tag: ${{ github.sha }}
          final-image-name: ${{ env.FINAL_IMAGE_NAME }}
          final-image-tag: ${{ github.sha }}
          registry-url: ${{ secrets.REGISTRY_URL }}
          registry-username: ${{ secrets.REGISTRY_USERNAME }}
          registry-password: ${{ secrets.REGISTRY_PASSWORD }}

  deploy-container:
    name: Deploy Azure Container App
    runs-on: ubuntu-latest
    needs: push-image
    environment:
      name: azure-containers

    steps:
      - uses: actions/checkout@v6

      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - uses: ./.github/actions/deploy-on-azure
        with:
          final-image-name: ${{ env.FINAL_IMAGE_NAME }}
          final-image-tag: ${{ github.sha }}
          container-app-name: ${{ secrets.CONTAINER_APP_NAME }}
          resource-group: ${{ secrets.RESOURCE_GROUP }}
          registry-url: ${{ secrets.REGISTRY_URL }}
          registry-username: ${{ secrets.REGISTRY_USERNAME }}
          registry-password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Logout of Azure
        shell: bash
        run: az logout

  remove-prev-images:
    name: Remove previous Docker images
    runs-on: ubuntu-latest
    needs: deploy-container
    environment:
      name: azure-containers

    steps:
      - uses: actions/checkout@v6

      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - uses: ./.github/actions/delete-prev-images
        with:
          final-image-name: ${{ env.FINAL_IMAGE_NAME }}
          registry-name: ${{ secrets.REGISTRY_NAME }}

      - name: Logout of Azure
        shell: bash
        run: az logout
