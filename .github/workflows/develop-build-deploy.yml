name: CI/CD to Azure Infrastructure (develop)

on:
  push:
    branches: [ develop ]
  # Run nightly build at 2:00 AM UTC every night
  # schedule:
  #   - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: develop-build-deploy
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.13'
  ARTIFACT_NAME: 'iso-address-structuring-grpc-${{ github.run_id }}'
  BASE_IMAGE_NAME: 'base-image-${{ github.run_id }}'
  BASE_IMAGE_TAG: ${{ github.sha }}
  FINAL_IMAGE_NAME: 'iso20022-address-structuring-grpc'
  FINAL_IMAGE_TAG: ${{ github.sha }}

jobs:
  main-infra:
    name: Deploy main infrastructure via ARM
    runs-on: ubuntu-latest
    environment:
      name: azure-container-deployment-dev

    steps:
      - uses: actions/checkout@v6

      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - uses: ./.github/actions/deploy-main-infra
        id: deploy-main-infra
        with:
          environment: ${{ vars.ENVIRONMENT }}
          resource-group: ${{ secrets.RESOURCE_GROUP }}
          registry-name: ${{ secrets.REGISTRY_NAME }}
          managed-identity-name: ${{ secrets.MANAGED_IDENTITY_NAME }}
          key-vault-name: ${{ secrets.KEY_VAULT_NAME }}
          user-id: ${{ secrets.USER_ID }}
          service-principal-id: ${{ secrets.SERVICE_PRINCIPAL_ID }}

      - name: Logout of Azure
        shell: bash
        run: az logout

  build-base-image:
    name: Build base Docker image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/build-base-image
        with:
          base-image-name: ${{ env.BASE_IMAGE_NAME }}
          base-image-tag: ${{ env.BASE_IMAGE_TAG }}

  build-python:
    name: Build Python Application
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: ./.github/actions/build-app
        with:
          artifact-name: ${{ env.ARTIFACT_NAME }}

  unit-test:
    name: Run unit tests
    runs-on: ubuntu-latest
    needs:
      - build-python

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/run-unit-tests
        with:
          artifact-name: ${{ env.ARTIFACT_NAME }}

  integration-test:
    name: Run integration tests
    runs-on: ubuntu-latest
    needs:
      - unit-test

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/run-integration-tests
        with:
          artifact-name: ${{ env.ARTIFACT_NAME }}

  push-image:
    name: Push to Azure Container Registry
    runs-on: ubuntu-latest
    needs:
      - main-infra
      - build-base-image
      - integration-test
    environment:
      name: azure-container-deployment-dev

    steps:
      - uses: actions/checkout@v6

      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - uses: ./.github/actions/push-docker-image
        with:
          resource-group: ${{ secrets.RESOURCE_GROUP }}
          artifact-name: ${{ env.ARTIFACT_NAME }}
          base-image-name: ${{ env.BASE_IMAGE_NAME }}
          base-image-tag: ${{ env.BASE_IMAGE_TAG }}
          final-image-name: ${{ env.FINAL_IMAGE_NAME }}
          final-image-tag: ${{ env.FINAL_IMAGE_TAG }}
          key-vault-name: ${{ secrets.KEY_VAULT_NAME }}

      - name: Logout of Azure
        shell: bash
        run: az logout

  container-infra:
    name: Deploy container infrastructure via ARM
    runs-on: ubuntu-latest
    needs:
      - main-infra
      - push-image
    environment:
      name: azure-container-deployment-dev

    steps:
      - uses: actions/checkout@v6

      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - uses: ./.github/actions/deploy-container-infra
        with:
          environment: ${{ vars.ENVIRONMENT }}
          resource-group: ${{ secrets.RESOURCE_GROUP }}
          final-image-name: ${{ env.FINAL_IMAGE_NAME }}
          final-image-tag: ${{ env.FINAL_IMAGE_TAG }}
          registry-name: ${{ secrets.REGISTRY_NAME }}
          managed-identity-name: ${{ secrets.MANAGED_IDENTITY_NAME }}
          container-instance-name: ${{ secrets.CONTAINER_INSTANCE_NAME }}

      - name: Logout of Azure
        shell: bash
        run: az logout

  remove-prev-images:
    name: Remove previous Docker images
    runs-on: ubuntu-latest
    needs:
      - container-infra
    environment:
      name: azure-container-deployment-dev

    steps:
      - uses: actions/checkout@v6

      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - uses: ./.github/actions/delete-prev-images
        with:
          final-image-name: ${{ env.FINAL_IMAGE_NAME }}
          registry-name: ${{ secrets.REGISTRY_NAME }}

      - name: Logout of Azure
        shell: bash
        run: az logout

  test-container-instance:
    name: Test the deployed Container Instances
    runs-on: ubuntu-latest
    needs:
      - container-infra
    environment:
      name: azure-container-deployment-dev

    steps:
      - uses: actions/checkout@v6

      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - uses: ./.github/actions/test-container-deployment
        with:
          resource-group: ${{ secrets.RESOURCE_GROUP }}
          container-instance-name: ${{ secrets.CONTAINER_INSTANCE_NAME }}

      - name: Logout of Azure
        shell: bash
        run: az logout
