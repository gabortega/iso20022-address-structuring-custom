name: Push to Azure Container Registry
description: 'Download all required dependencies and build the Python application'
inputs:
  resource-group:
    description: 'Name of the Azure Resource Group'
    required: true
  artifact-name:
    description: 'Name of the artifact that will be downloaded'
    required: true
  artifact-file-name:
    description: 'Name of the artifact archive file'
    required: true
    default: 'app'
  base-image-name:
    description: 'Name of the base image'
    required: true
  base-image-tag:
    description: 'Tag of the base image'
    required: true
  final-image-name:
    description: 'Name of the final image'
    required: true
  final-image-tag:
    description: 'Tag of the final image'
    required: true
  key-vault-name:
    description: 'Name of the Key Vault'
    required: true
runs:
  using: "composite"
  steps:
    - name: Mask inputs
      shell: bash
      run: |
        echo "::add-mask::${{ inputs.resource-group }}"
        echo "::add-mask::${{ inputs.key-vault-name }}"

    - name: Fetch the Azure Container Registry's credentials
      id: fetch-registry-credentials
      shell: bash
      run: ${{ github.action_path }}/../scripts/fetch-acr-key-vault-secrets.sh
      env:
        KEY_VAULT: ${{ inputs.key-vault-name }}

    - name: Download Python code artifact
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.artifact-name }}

    - name: Unzip Python code artifact
      shell: bash
      run: unzip -o ${{ inputs.artifact-file-name }}.zip

    - name: Download base image artifact
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.base-image-name }}
        path: ${{ runner.temp }}

    - name: Load base image
      shell: bash
      run: docker load --input ${{ runner.temp }}/${{ inputs.base-image-name }}.tar

    - name: Login to Azure Container Registry
      uses: docker/login-action@v4
      with:
        registry: ${{ steps.fetch-registry-credentials.outputs.registry_url }}
        username: ${{ steps.fetch-registry-credentials.outputs.registry_username }}
        password: ${{ steps.fetch-registry-credentials.outputs.registry_password }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile.final
        build-args: BASE_IMAGE=${{ inputs.base-image-name }}:${{ inputs.base-image-tag }}
        push: true
        tags: |
          ${{ steps.fetch-registry-credentials.outputs.registry_url }}/${{ inputs.final-image-name }}:latest
          ${{ steps.fetch-registry-credentials.outputs.registry_url }}/${{ inputs.final-image-name }}:${{ inputs.final-image-tag }}
