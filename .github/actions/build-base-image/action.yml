name: Build Docker base image
description:
  'Build the Docker base image that will be used to create the final image'
inputs:
  base-image-name:
    description: 'Name of the base image'
    required: true
  base-image-tag:
    description: 'Tag of the base image'
    required: true
runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v6

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build base image and export
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile.base
        tags: ${{ inputs.base-image-name }}:${{ inputs.base-image-tag }}
        outputs: type=docker,dest=${{ runner.temp }}/${{ inputs.base-image-name }}.tar

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.base-image-name }}
        path: ${{ runner.temp }}/${{ inputs.base-image-name }}.tar
