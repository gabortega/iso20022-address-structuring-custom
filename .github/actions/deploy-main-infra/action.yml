name: deploy-main-infra
description: 'Deploys the main infrastructure without including the Container App'
inputs:
  environment:
    description: 'Name of the Azure environment to deploy'
    required: true
  resource-group:
    description: 'Name of the Azure Resource Group'
    required: true
  registry-name:
    description: 'Name of the Azure Container Registry'
    required: true
  key-vault-name:
    description: 'Name of the Key Vault'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Mask inputs
      shell: bash
      run: |
        echo "::add-mask::${{ inputs.resource-group }}"
        echo "::add-mask::${{ inputs.registry-name }}"
        echo "::add-mask::${{ inputs.key-vault-name }}"

    - name: Deploy Bicep (without Container Instance)
      id: deploy-main-infra
      uses: azure/arm-deploy@v2
      with:
        deploymentMode: 'Complete'
        resourceGroupName: ${{ inputs.resource-group }}
        scope: 'resourcegroup'
        template: ./infra/main.bicep
        parameters: >
          ./infra/environments/${{ inputs.environment }}.main.bicepparam
          acrName=${{ inputs.registry-name }}
          keyVaultName=${{ inputs.key-vault-name }}
        failOnStdErr: 'true'